
name: Run Discord Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install discord.py
        run: pip install discord.py

      - name: Start bot
        env:
          DISCORD_SECRET: ${{ secrets.DISCORD_SECRET }}
        run: python bot.py
